name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --release --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  scripts:
    name: plotting scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib pillow
      - run: cargo build --release --locked -p cubesphere-cli
      - name: Generate sample data
        run: |
          ./target/release/cubesphere converge --mode h --ks 2,4 --order 2 \
            --alpha0-deg 45 --wind solid-body --initial gaussian --csv-out out/h.csv
          ./target/release/cubesphere run --k 2 --order 3 --wind deformational \
            --initial twin-gaussian --periods 0.2 --frames 3 --pvd-dir out/anim
      - name: Run plotting scripts
        run: |
          python scripts/plot_convergence.py out/h.csv -o out/h.png
          python scripts/plot_grids.py --k 2 --order 2 -o out/grids.png
          python scripts/pvd_to_gif.py out/anim/frame.pvd -o out/anim.gif
          ls -l out/h.png out/grids.png out/anim.gif
