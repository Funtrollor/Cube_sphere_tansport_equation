[package]
name = "cs-backend-cuda"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["LI, CHIN-KAI"]
description = "NVIDIA cuda-oxide (pure Rust CUDA SIMT) GPU backend for Cubed-Sphere transport"

# Isolated standalone workspace so root `cargo test` builds pure Rust CPU crates
# without requiring CUDA Toolkit, libclang-21, or rustc 1.99.1 + RUSTC_BOOTSTRAP=1.
[workspace]

[dependencies]
cs-core = { path = "../cs-core" }
cs-equations = { path = "../cs-equations" }
cs-solver = { path = "../cs-solver" }
cs-backend-cpu = { path = "../cs-backend-cpu" }
cs-io = { path = "../cs-io" }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git" }
