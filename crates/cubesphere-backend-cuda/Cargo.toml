[package]
name = "cubesphere-backend-cuda"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["LI, CHIN-KAI"]
repository = "https://github.com/Funtrollor/cubesphere"
publish = false  # depends on git-only NVIDIA/cuda-rust crates
description = "NVIDIA cuda-oxide (pure Rust CUDA SIMT) GPU backend for Cubed-Sphere transport"

# Isolated standalone workspace so root `cargo test` builds pure Rust CPU crates
# without requiring CUDA Toolkit, libclang-21, or rustc 1.99.1 + RUSTC_BOOTSTRAP=1.
[workspace]

[dependencies]
cubesphere-core = { path = "../cubesphere-core" }
cubesphere-equations = { path = "../cubesphere-equations" }
cubesphere-solver = { path = "../cubesphere-solver" }
cubesphere-backend-cpu = { path = "../cubesphere-backend-cpu" }
cubesphere-io = { path = "../cubesphere-io" }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git" }
